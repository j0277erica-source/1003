<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方塊單字島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：單欄手機優先的方塊積木風遊戲，頂部狀態列＋中央題目卡＋底部大按鈕。單一固定的明亮配色。 */
:root {
  --sky: #8fd3ff;
  --sky-2: #c9ecff;
  --grass: #4cc35a;
  --grass-d: #2f8f3c;
  --dirt: #8a5a35;
  --brick: #ff5a4d;
  --brick-d: #b73228;
  --gold: #ffc928;
  --gold-d: #b78a00;
  --ink: #1d2433;
  --paper: #ffffff;
  --blue: #3b82f6;
  --blue-d: #1e4fb0;
  --font-en: "Fredoka", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
  --font-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--sky);
  background-image:
    linear-gradient(var(--sky-2) 0 0),
    repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 48px, transparent 48px 96px);
  background-size: 100% 38%, auto;
  background-repeat: no-repeat, repeat;
  color: var(--ink);
  font-family: var(--font-zh);
  font-size: 16px;
  padding-inline: 16px;
  padding-block: 14px 40px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.en { font-family: var(--font-en); }

/* 方塊元件 */
.block {
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 6px;
  box-shadow: 0 6px 0 var(--ink);
}
.btn {
  font: 900 1.1rem/1.2 var(--font-zh);
  color: #fff;
  background: var(--grass);
  border: 4px solid var(--ink);
  border-radius: 6px;
  box-shadow: 0 6px 0 var(--grass-d), 0 6px 0 4px var(--ink);
  padding: 14px 18px;
  cursor: pointer;
  min-height: 56px;
  text-shadow: 0 2px 0 rgba(0,0,0,.25);
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--grass-d), 0 1px 0 4px var(--ink); }
.btn:focus-visible, .opt:focus-visible, .tile:focus-visible, .chip:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
.btn.blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-d), 0 6px 0 4px var(--ink); }
.btn.blue:active { box-shadow: 0 1px 0 var(--blue-d), 0 1px 0 4px var(--ink); }
.btn.red { background: var(--brick); box-shadow: 0 6px 0 var(--brick-d), 0 6px 0 4px var(--ink); }
.btn.ghost { background: var(--paper); color: var(--ink); text-shadow: none; box-shadow: 0 6px 0 #c7ccd6, 0 6px 0 4px var(--ink); }

/* 首頁 */
.hero { padding: 22px 16px 20px; text-align: center; background: var(--grass); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 26px; background: var(--dirt); border-top: 4px solid var(--ink); }
.hero h1 { margin: 0; font-weight: 900; font-size: clamp(2rem, 9vw, 2.8rem); color: #fff; text-shadow: 0 4px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink); letter-spacing: .06em; text-wrap: balance; }
.hero p { margin: 8px 0 34px; font-weight: 700; color: var(--ink); background: var(--gold); display: inline-block; padding: 4px 12px; border: 3px solid var(--ink); border-radius: 4px; }
.panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 1.1rem; font-weight: 900; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.chip {
  font: 700 1rem var(--font-zh); color: var(--ink); background: #eef4ff;
  border: 3px solid var(--ink); border-radius: 6px; padding: 10px 8px; cursor: pointer; min-height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.chip[aria-pressed="true"] { background: var(--gold); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
.chip .em { font-size: 1.4rem; }
.best { font-weight: 700; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.note { margin: 0; font-size: .85rem; color: #4b5568; line-height: 1.6; }

/* 遊戲 */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 10px 12px; background: var(--paper); }
.hud .lives { font-size: 1.3rem; letter-spacing: 2px; }
.hud .mid { text-align: center; font-weight: 900; font-variant-numeric: tabular-nums; }
.hud .score { text-align: right; font-family: var(--font-en); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.bar { height: 16px; background: #fff; border: 3px solid var(--ink); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--grass) 0 14px, #6fdc7c 14px 16px); transition: width .25s; }
.tbar { position: relative; height: 22px; background: #fff; border: 3px solid var(--ink); border-radius: 4px; overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--blue); transition: width .1s linear, background .2s; }
.tbar.low i { background: var(--brick); }
.tbar b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 .85rem var(--font-en); font-variant-numeric: tabular-nums; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.combo { min-height: 26px; text-align: center; font-weight: 900; color: var(--brick-d); font-size: 1.05rem; }
.card { padding: 20px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.pic { font-size: clamp(4.5rem, 24vw, 6.5rem); line-height: 1.1; }
.zh { font-size: 1.5rem; font-weight: 900; }
.hint { font-size: .95rem; color: #4b5568; font-weight: 700; margin: 0; }
.say { font-size: 1rem; padding: 8px 14px; min-height: 44px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  font: 700 1.35rem var(--font-en); color: var(--ink); background: #fff7d6;
  border: 4px solid var(--ink); border-radius: 6px; box-shadow: 0 6px 0 var(--ink);
  padding: 16px 6px; min-height: 64px; cursor: pointer; overflow-wrap: anywhere;
}
.opt:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.opt.ok { background: var(--grass); color: #fff; }
.opt.bad { background: var(--brick); color: #fff; animation: shake .35s; }
.opt:disabled { cursor: default; }
@media (max-width: 340px) { .opts { grid-template-columns: 1fr; } }

.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 54px; }
.slot {
  width: 40px; height: 50px; border: 3px solid var(--ink); border-radius: 5px; background: #eef4ff;
  display: grid; place-items: center; font: 700 1.6rem var(--font-en);
}
.slot.on { background: var(--grass); color: #fff; }
.slot.rev { background: var(--gold); }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  width: 52px; height: 56px; font: 700 1.6rem var(--font-en); color: var(--ink);
  background: #ffe28a; border: 4px solid var(--ink); border-radius: 6px; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
}
.tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.tile:disabled { opacity: .25; box-shadow: none; transform: translateY(5px); cursor: default; }
.tile.bad { animation: shake .35s; background: var(--brick); color: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }

.toast { text-align: center; font-weight: 900; font-size: 1.1rem; min-height: 28px; }
.toast.good { color: var(--grass-d); }
.toast.no { color: var(--brick-d); }

/* 結果 */
.result { padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.stars { font-size: 3rem; letter-spacing: 6px; }
.big { font: 700 2.6rem var(--font-en); }
.review { width: 100%; text-align: left; }
.review ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.review li { display: flex; gap: 10px; align-items: center; background: #fff1f0; border: 3px solid var(--ink); border-radius: 6px; padding: 6px 10px; }
.review li .em { font-size: 1.6rem; }
.review li b { font-family: var(--font-en); font-size: 1.15rem; }

.arena { padding: 0; overflow: hidden; line-height: 0; }
.arena canvas { width: 100%; display: block; touch-action: none; cursor: crosshair; }
.me { display: grid; gap: 8px; }
.me .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 900; }
.me .lv { font: 700 1.3rem var(--font-en); background: var(--gold); border: 3px solid var(--ink); border-radius: 4px; padding: 2px 10px; }
.me .stats { display: flex; gap: 8px; flex-wrap: wrap; font-weight: 900; }
.me .stats span { background: #eef4ff; border: 3px solid var(--ink); border-radius: 4px; padding: 3px 9px; font-variant-numeric: tabular-nums; }
.mini { height: 14px; background: #fff; border: 3px solid var(--ink); border-radius: 4px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--gold); }
.mini.g i { background: var(--grass); }
.lab { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 700; }
.rw { display: grid; gap: 6px; text-align: left; width: 100%; }
.rw div { background: #fff8d6; border: 3px solid var(--ink); border-radius: 6px; padding: 6px 10px; font-weight: 700; }
.rw .box { background: #e8dcff; font-size: 1.05rem; }
.rw .box .sk { font-size: 2.4rem; display: block; text-align: center; animation: pop .5s; }
.stk { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.stk span { aspect-ratio: 1; display: grid; place-items: center; font-size: 1.9rem; background: #eef4ff; border: 3px solid var(--ink); border-radius: 6px; position: relative; }
.stk span.no { filter: grayscale(1); opacity: .35; }
.stk span small { position: absolute; right: 2px; bottom: 0; font: 700 .65rem var(--font-en); }
.wds { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.wds span { font: 700 .95rem var(--font-en); background: #eef4ff; border: 3px solid var(--ink); border-radius: 6px; padding: 4px 8px; display: flex; justify-content: space-between; gap: 4px; }
.wds span.ok { background: var(--gold); }
.bdg { display: grid; gap: 6px; }
.bdg div { border: 3px solid var(--ink); border-radius: 6px; padding: 6px 10px; font-weight: 700; background: #eef4ff; }
.bdg div.on { background: #d9f7dd; }
.bdg div.off { opacity: .55; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.pop { animation: pop .3s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function () {
  "use strict";

  // 示範單字庫（emoji 當圖示，不需要外部圖片）
  var THEMES = [
    { id: "animal", name: "動物", em: "🐯", words: [
      ["cat","貓","🐱"],["dog","狗","🐶"],["bird","鳥","🐦"],["fish","魚","🐟"],["rabbit","兔子","🐰"],
      ["monkey","猴子","🐵"],["tiger","老虎","🐯"],["elephant","大象","🐘"],["duck","鴨子","🦆"],["pig","豬","🐷"]] },
    { id: "fruit", name: "水果", em: "🍎", words: [
      ["apple","蘋果","🍎"],["banana","香蕉","🍌"],["orange","柳橙","🍊"],["grape","葡萄","🍇"],["lemon","檸檬","🍋"],
      ["peach","桃子","🍑"],["cherry","櫻桃","🍒"],["mango","芒果","🥭"],["pear","梨子","🍐"],["melon","哈密瓜","🍈"]] },
    { id: "color", name: "顏色", em: "🎨", words: [
      ["red","紅色","🟥"],["blue","藍色","🟦"],["green","綠色","🟩"],["yellow","黃色","🟨"],["orange","橘色","🟧"],
      ["purple","紫色","🟪"],["black","黑色","⬛"],["white","白色","⬜"],["brown","棕色","🟫"],["pink","粉紅色","🩷"]] },
    { id: "school", name: "學校", em: "🎒", words: [
      ["book","書","📖"],["pencil","鉛筆","✏️"],["bag","書包","🎒"],["ruler","尺","📏"],["scissors","剪刀","✂️"],
      ["chair","椅子","🪑"],["clock","時鐘","🕐"],["school","學校","🏫"],["computer","電腦","💻"],["map","地圖","🗺️"]] },
    { id: "number", name: "數字", em: "🔢", words: [
      ["one","一","1️⃣"],["two","二","2️⃣"],["three","三","3️⃣"],["four","四","4️⃣"],["five","五","5️⃣"],
      ["six","六","6️⃣"],["seven","七","7️⃣"],["eight","八","8️⃣"],["nine","九","9️⃣"],["ten","十","🔟"]] }
  ];
  var ROUND = 10, MAX_LIVES = 3;

  var app = document.getElementById("app");
  var st = { mode: "shoot", theme: "animal", sound: true, timer: true, best: {} };
  var g = null; // 遊戲狀態

  try { var b = JSON.parse(localStorage.getItem("fkwi-best") || "{}"); if (b && typeof b === "object") st.best = b; } catch (e) {}
  // 玩家進度（存在這台裝置的瀏覽器裡）
  var STICKERS = {
    c: ["🐣","🐸","🐙","🦊","🐼","🐨","🦁","🐧","🐢","🐝"],
    r: ["🦄","🐲","🦖","🐬","🦋"],
    e: ["👑","🚀","🌈"]
  };
  var RARE = { c: "普通", r: "稀有", e: "史詩" };
  var TITLES = ["新手冒險家","單字小學徒","方塊射手","單字獵人","方塊勇者","單字大師","傳說英雄"];
  var GOAL = 15, TOTAL_WORDS = 0;
  THEMES.forEach(function (t) { TOTAL_WORDS += t.words.length; });
  var BADGES = [
    { id: "first", n: "🌱 第一次完成一回合", ok: function () { return pf.rounds >= 1; } },
    { id: "combo10", n: "🔥 一次連續答對 10 題", ok: function () { return pf.maxCombo >= 10; } },
    { id: "boss", n: "👹 打倒 BOSS", ok: function () { return pf.boss >= 1; } },
    { id: "streak3", n: "📅 連續 3 天來練習", ok: function () { return pf.streak >= 3; } },
    { id: "goal", n: "🎯 完成每日目標", ok: function () { return pf.goalDays >= 1; } },
    { id: "m10", n: "📘 學會 10 個單字", ok: function () { return mastered().length >= 10; } },
    { id: "m50", n: "🎓 學會全部單字", ok: function () { return mastered().length >= TOTAL_WORDS; } },
    { id: "lv5", n: "⭐ 升到 Lv.5", ok: function () { return level() >= 5; } }
  ];
  var pf = { xp: 0, coins: 0, streak: 0, lastDay: "", day: "", today: 0, claimed: false, rounds: 0, boss: 0, maxCombo: 0, goalDays: 0, mastery: {}, stickers: {}, badges: {} };
  try { var sp = JSON.parse(localStorage.getItem("fkwi-prof") || "{}"); if (sp && typeof sp === "object") for (var kk in sp) pf[kk] = sp[kk]; } catch (e) {}
  function saveProf() { try { localStorage.setItem("fkwi-prof", JSON.stringify(pf)); } catch (e) {} }
  function dayStr(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  (function daily() {
    var now = new Date(), today = dayStr(now);
    if (pf.day !== today) { pf.day = today; pf.today = 0; pf.claimed = false; }
    if (pf.lastDay !== today) {
      var diff = 99;
      if (pf.lastDay) { var q = pf.lastDay.split("-"); diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(+q[0], +q[1] - 1, +q[2])) / 864e5); }
      pf.streak = diff === 1 ? pf.streak + 1 : 1; pf.lastDay = today; saveProf();
    }
  })();
  function level() { return Math.floor(Math.sqrt(pf.xp / 60)) + 1; }
  function mastered() { var r = []; for (var w in pf.mastery) if (pf.mastery[w] >= 3) r.push(w); return r; }
  var snap = { m: mastered().length, lv: level() };
  function recordCorrect(word) { pf.mastery[word] = (pf.mastery[word] || 0) + 1; pf.today++; pf.xp += 10; }
  function rewards(score, boxOk, bossWin) {
    var out = [], coins = Math.floor(score / 10);
    pf.rounds++; pf.maxCombo = Math.max(pf.maxCombo, g.maxCombo);
    if (bossWin) { pf.boss++; pf.xp += 100; coins += 30; }
    out.push("🪙 獲得金幣 +" + coins + (bossWin ? "（含 BOSS 獎勵 +30）" : ""));
    if (!pf.claimed && pf.today >= GOAL) { pf.claimed = true; pf.goalDays++; coins += 30; out.push("🎯 今日目標達成！金幣再 +30"); }
    var lv = level();
    if (lv > snap.lv) out.push("🆙 升級了！現在是 Lv." + lv + "「" + TITLES[Math.min(Math.floor((lv - 1) / 2), 6)] + "」");
    var nm = mastered().length - snap.m;
    if (nm > 0) out.push("✨ 新學會 " + nm + " 個單字（答對 3 次就算學會）");
    var html = out.map(function (t) { return "<div>" + h(t) + "</div>"; }).join("");
    if (boxOk) {
      var r = Math.random(), tier = r < 0.05 ? "e" : r < 0.3 ? "r" : "c", list = STICKERS[tier], sk = list[Math.floor(Math.random() * list.length)];
      var isNew = !pf.stickers[sk]; pf.stickers[sk] = (pf.stickers[sk] || 0) + 1;
      if (!isNew) coins += 5;
      html += '<div class="box">🎁 神祕寶箱！獲得' + RARE[tier] + '貼紙<span class="sk">' + sk + '</span>' + (isNew ? "新貼紙！已放進圖鑑" : "已經有了，換成金幣 +5") + '</div>';
    }
    pf.coins += coins;
    var nb = [];
    BADGES.forEach(function (b) { if (!pf.badges[b.id] && b.ok()) { pf.badges[b.id] = 1; nb.push(b.n); } });
    if (nb.length) html += '<div>🏅 新徽章：' + nb.map(h).join("、") + '</div>';
    snap = { m: mastered().length, lv: lv };
    saveProf();
    return '<div class="block panel"><h2>本回合獎勵</h2><div class="rw">' + html + '</div></div>';
  }
  function meHtml() {
    var lv = level(), lo = 60 * (lv - 1) * (lv - 1), hi = 60 * lv * lv, pct = Math.round((pf.xp - lo) / (hi - lo) * 100);
    var gp = Math.min(pf.today, GOAL);
    return '<section class="block panel me"><div class="top"><span class="lv">Lv.' + lv + '</span><span>' + TITLES[Math.min(Math.floor((lv - 1) / 2), 6)] + '</span></div>' +
      '<div><div class="lab"><span>經驗值</span><span>' + (pf.xp - lo) + ' / ' + (hi - lo) + '</span></div><div class="mini"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="stats"><span>🪙 ' + pf.coins + '</span><span>🔥 連續 ' + pf.streak + ' 天</span><span>📒 圖鑑 ' + mastered().length + ' / ' + TOTAL_WORDS + '</span></div>' +
      '<div><div class="lab"><span>🎯 今日目標：答對 ' + GOAL + ' 題</span><span>' + gp + ' / ' + GOAL + (pf.today >= GOAL ? " ✅ 今天做得很棒，也記得休息眼睛！" : "") + '</span></div><div class="mini g"><i style="width:' + (gp / GOAL * 100) + '%"></i></div></div>' +
      '<button class="btn blue" id="book">📒 我的圖鑑與徽章</button></section>';
  }
  function book() {
    var all = []; for (var t in STICKERS) all = all.concat(STICKERS[t]);
    var got = all.filter(function (e) { return pf.stickers[e]; }).length;
    app.innerHTML =
      '<section class="block panel"><h2>🎁 貼紙收藏 ' + got + ' / ' + all.length + '</h2><div class="stk">' +
        all.map(function (e) { var n = pf.stickers[e] || 0; return '<span class="' + (n ? "" : "no") + '">' + (n ? e : "❔") + (n > 1 ? "<small>×" + n + "</small>" : "") + '</span>'; }).join("") +
      '</div><p class="note">打完一回合（答對 4 題以上）會開一個神祕寶箱，打倒 BOSS 也有。越稀有越難抽到！</p></section>' +
      THEMES.map(function (t) {
        var n = t.words.filter(function (w) { return (pf.mastery[w[0]] || 0) >= 3; }).length;
        return '<section class="block panel"><h2>' + t.em + ' ' + t.name + ' ' + n + ' / ' + t.words.length + '</h2><div class="wds">' +

  function rr(ctx, x, y, w, h, r) {

    // 槍口與準星
    ctx.fillStyle = "#1d2433"; rr(ctx, W / 2 - 18 * k, H - 22 * k, 36 * k, 28 * k, 5); ctx.fill();
    ctx.fillStyle = s.flash > 0 ? "#ffe94d" : "#6b7385"; ctx.fillRect(W / 2 - 6 * k, H - 34 * k, 12 * k, 16 * k);
    ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 3; var cx = s.px, cy = s.py, r = 14 * k;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.moveTo(cx - r - 6, cy); ctx.lineTo(cx + r + 6, cy); ctx.moveTo(cx, cy - r - 6); ctx.lineTo(cx, cy + r + 6); ctx.stroke();
    ctx.restore();
    raf = requestAnimationFrame(loop);
  }

  function toast(msg, cls) { var t = $("#toast"); if (t) { t.textContent = msg; t.className = "toast " + (cls || ""); } }
  function updateHud() {
    var scoreEl = $(".hud .score"); if (scoreEl) scoreEl.textContent = "⭐ " + g.score;
    var hearts = ""; for (var k = 0; k < MAX_LIVES; k++) hearts += k < g.lives ? "❤️" : "🖤";
    var l = $(".hud .lives"); if (l) l.textContent = hearts;
    var c = $("#combo"); if (c) c.textContent = g.combo >= 2 ? "🔥 連續答對 " + g.combo + " 題！" : "";
  }

  function gain(base) {
    g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo);
    var bonus = Math.min(g.combo - 1, 5) * 2;
    g.score += base + bonus; g.right++; recordCorrect(g.q.word);
    return base + bonus;
  }
  function lose() {
    g.combo = 0; g.lives--;
    g.wrong.push({ word: g.q.word, zh: g.q.zh, em: g.q.em });
  }
  function next(delay) {
    g.locked = true;
    setTimeout(function () {
      g.i++;
      if (g.lives <= 0 || g.i >= g.n || (g.boss && g.bossHp <= 0)) finish(); else question();
    }, delay);
  }

  function answerChoice(btn) {
    if (g.locked) return;
    g.locked = true;
    var w = btn.getAttribute("data-w"), ok = w === g.q.word;
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (o) {
      o.disabled = true;
      if (o.getAttribute("data-w") === g.q.word) o.classList.add("ok");
    });
    if (ok) { var p = gain(10); sfx.ok(); toast("答對了！+" + p + " 分", "good"); }
    else { btn.classList.add("bad"); lose(); sfx.no(); toast("正確答案是 " + g.q.word, "no"); }
    updateHud(); speak(g.q.word);
    next(1500);
  }

  function slotEls() { return app.querySelectorAll(".slot"); }
  function tapTile(btn) {
    if (g.locked) return;
    var q = g.q, c = btn.getAttribute("data-c");
    if (c === q.word.charAt(q.pos)) {
      var s = slotEls()[q.pos]; s.textContent = c; s.classList.add("on", "pop");
      btn.disabled = true; q.pos++;
      if (q.pos >= q.word.length) {
        var base = Math.max(5, 20 - q.miss * 5);
        var p = gain(base); sfx.ok(); toast("拼對了！+" + p + " 分", "good");
        updateHud(); speak(q.word); next(1500);
      }
    } else {
      btn.classList.remove("bad"); void btn.offsetWidth; btn.classList.add("bad");
      q.miss++; g.combo = 0; sfx.no(); updateHud();
      if (q.miss >= 3) { reveal(true); } else toast("再試一次，下一個字母是哪個？", "no");
    }
  }
  function reveal(loseHeart, msg) {
    var q = g.q;
    g.locked = true;
    var slots = slotEls();
    for (var k = q.pos; k < q.word.length; k++) { slots[k].textContent = q.word.charAt(k); slots[k].classList.add("rev"); }
    Array.prototype.forEach.call(app.querySelectorAll(".tile"), function (t) { t.disabled = true; });
    if (loseHeart) lose();
    toast(msg || "答案是 " + q.word, "no"); updateHud(); speak(q.word);
    next(1900);
  }
  function hint() {
    if (g.locked) return;
    var q = g.q, c = q.word.charAt(q.pos);
    var tile = Array.prototype.filter.call(app.querySelectorAll(".tile"), function (t) { return !t.disabled && t.getAttribute("data-c") === c; })[0];
    if (!tile) return;
    g.score = Math.max(0, g.score - 5); q.hinted++;
    var s = slotEls()[q.pos]; s.textContent = c; s.classList.add("rev");
    tile.disabled = true; q.pos++; updateHud();
    if (q.pos >= q.word.length) { gain(5); toast("完成！下次少用提示會拿更多分", "good"); sfx.ok(); speak(q.word); updateHud(); next(1500); }
  }

  function startBoss() {
    var th = g.theme, score = g.score, combo = g.combo, maxCombo = g.maxCombo, right = g.right;
    g = { theme: th, mode: "shoot", n: 8, boss: true, bossHp: 5, qs: shuffle(th.words).slice(0, 8), i: 0,
      score: score, lives: MAX_LIVES, combo: combo, maxCombo: maxCombo, right: right, wrong: [], locked: false };
    question();
  }
  function bossFinish() {
    var win = g.bossHp <= 0;
    if (win) { g.score += 100; sfx.win(); }
    var key = st.theme + ":boss", isBest = g.score > (st.best[key] || 0);
    if (isBest) { st.best[key] = g.score; saveBest(); }
    var rw = rewards(g.score, win, win);
    var review = g.wrong.length
      ? '<div class="block panel review"><h2>需要再複習的單字</h2><ul>' + g.wrong.map(function (w) {
          return '<li><span class="em">' + w.em + '</span><b>' + w.word + '</b><span>' + h(w.zh) + '</span></li>';
        }).join("") + '</ul></div>' : "";
    app.innerHTML =
      '<section class="block result"><div class="stars">' + (win ? "👑" : "💥") + '</div>' +
      '<div class="big">' + g.score + ' 分</div>' +
      '<div style="font-weight:900;font-size:1.3rem">' + (win ? "BOSS 被你打倒了！（+100 分）" : "BOSS 還活著，再來挑戰！") + '</div>' +
      (isBest ? '<div style="font-weight:900;color:var(--brick-d)">🏆 BOSS 新紀錄！</div>' : "") + '</section>' + rw + review +
      '<div class="row"><button class="btn red" id="rematch">再挑戰 BOSS</button><button class="btn blue" id="menu">回首頁</button></div>';
  }
  function finish() {
    stopLoop();
    if (g.boss) return bossFinish();
    var stars = g.right >= 9 ? 3 : g.right >= 7 ? 2 : g.right >= 4 ? 1 : 0;
    var key = st.theme + ":" + st.mode, isBest = g.score > (st.best[key] || 0);
    if (isBest) { st.best[key] = g.score; saveBest(); }
    if (stars >= 2) sfx.win();
    var dead = g.lives <= 0;
    var msg = dead ? "愛心用完了，再挑戰一次吧！" : stars === 3 ? "太厲害了，你是單字小英雄！" : stars === 2 ? "很棒喔，再努力一點就滿星！" : "繼續練習，你一定可以的！";
    var starStr = "";
    for (var k = 0; k < 3; k++) starStr += k < stars ? "⭐" : "☆";
    var rw = rewards(g.score, g.right >= 4, false);
    var review = g.wrong.length
      ? '<div class="block panel review"><h2>需要再複習的單字</h2><ul>' + g.wrong.map(function (w) {
          return '<li><span class="em">' + w.em + '</span><b>' + w.word + '</b><span>' + h(w.zh) + '</span></li>';
        }).join("") + '</ul></div>' : "";
    app.innerHTML =
      '<section class="block result"><div class="stars" aria-label="' + stars + ' 顆星">' + starStr + '</div>' +
      '<div class="big">' + g.score + ' 分</div>' +
      '<div>答對 ' + g.right + ' 題・最高連續 ' + g.maxCombo + ' 題</div>' +
      (isBest ? '<div style="font-weight:900;color:var(--brick-d)">🏆 新紀錄！</div>' : "") +
      '<div style="font-weight:700">' + msg + '</div></section>' + rw + review +
      (dead ? "" : '<button class="btn red" id="boss">👹 挑戰 BOSS！</button>') +
      '<div class="row"><button class="btn" id="again">再玩一次</button><button class="btn blue" id="menu">回首頁</button></div>';
  }

  /* ---------- 事件 ---------- */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("button"); if (!el) return;
    if (el.hasAttribute("data-mode")) { st.mode = el.getAttribute("data-mode"); return home(); }
    if (el.hasAttribute("data-theme")) { st.theme = el.getAttribute("data-theme"); return home(); }
    if (el.classList.contains("opt")) return answerChoice(el);
    if (el.classList.contains("tile")) return tapTile(el);
    switch (el.id) {
      case "tm": st.timer = !st.timer; return home();
      case "snd": st.sound = !st.sound; return home();
      case "go": case "again": return start();
      case "menu": return home();
      case "book": return book();
      case "boss": case "rematch": return startBoss();
      case "say": return speak(g.q.word);
      case "hint": return hint();
      case "skip": if (!g.locked) { reveal(true); } return;
    }
  });

  home();
})();
</script>
</body>
</html>
